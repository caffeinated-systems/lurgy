# Visit https://soloterm.com to learn more
processes:
  API:
    # Solo's AppImage leaks its Python env into child shells; unset it so uv's Python works.
    command: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH uv run uvicorn app.main:app --reload
    working_dir: api
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    # Weeks built by hand: `uv run python -m app.generate <ISO week> -o out/<week>.json`.
    # out/ is gitignored, so a fresh clone has none: build one first, or use tests/fixtures/puzzles.
    env:
      PUZZLES_DIR: out
  npm:dev:
    command: npm run dev
    working_dir: web
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  API tests:
    # Run by hand; it stops when the suite finishes, so its status says when it's done.
    command: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH uv run pytest -q
    working_dir: api
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
