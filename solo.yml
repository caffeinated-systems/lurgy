name: null
icon: web/public/favicon.ico
processes:
  API:
    command: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH PUZZLES_DIR=out uv run uvicorn app.main:app --reload
    working_dir: api
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  API tests:
    command: env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH uv run pytest -q
    working_dir: api
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  npm:dev:
    command: npm run dev
    working_dir: web
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
