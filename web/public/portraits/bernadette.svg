<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Legal Charcoal Steel Partition -->
    <linearGradient id="bernPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B515A"/>
      <stop offset="100%" stop-color="#282C31"/>
    </linearGradient>

    <!-- Cashmere Black Gradient -->
    <linearGradient id="cashmereGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2D2F"/>
      <stop offset="100%" stop-color="#111213"/>
    </linearGradient>

    <linearGradient id="bernSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2D5C4"/>
      <stop offset="100%" stop-color="#DDAF97"/>
    </linearGradient>

    <filter id="softShadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#151719" flood-opacity="0.35"/>
    </filter>

    <filter id="violetLanyardGlowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#9D4EDD" flood-opacity="0.6"/>
    </filter>

    <clipPath id="bernClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Legal Partition Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#888E96"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#bernPartition)"/>

    <!-- Legal Disclaimer Memo -->
    <g transform="translate(48, 110) rotate(-2)">
      <rect width="64" height="48" rx="2" fill="#FFFFFF" stroke="#8A9099" stroke-width="1"/>
      <rect width="64" height="8" fill="#9D4EDD"/>
      <text x="32" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">LEGAL NOTICE</text>
      <text x="32" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1A1C1E" text-anchor="middle">NOTHING BEFORE</text>
      <text x="32" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="#C92A2A" text-anchor="middle">MY COFFEE</text>
      <text x="32" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1A1C1E" text-anchor="middle">IS BINDING.</text>
      <circle cx="32" cy="3" r="1.8" fill="#9D4EDD"/>
    </g>

    <!-- CHARACTER: BERNADETTE (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowB)">

      <!-- Fine-Gauge Cashmere Black Turtleneck Shoulders -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,304 160,300 L240,300 C290,304 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#cashmereGrad)" stroke="#0A0B0C" stroke-width="3"/>

      <!-- Cashmere Roll-Neck (High, pristine, covering full neck to jaw) -->
      <path d="M166,244 L164,306 C164,320 236,320 236,306 L234,244 Z" fill="#1E2022" stroke="#0A0B0C" stroke-width="2.5"/>
      <!-- Knit rib lines on roll collar -->
      <line x1="168" y1="262" x2="232" y2="262" stroke="#33373B" stroke-width="1.5"/>
      <line x1="167" y1="282" x2="233" y2="282" stroke="#33373B" stroke-width="1.5"/>

      <!-- ROYAL VIOLET LEGAL LANYARD -->
      <g filter="url(#violetLanyardGlowB)">
        <path d="M158,302 C162,360 182,410 196,444" stroke="#9D4EDD" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M242,302 C238,360 218,410 204,444" stroke="#9D4EDD" stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,302 C162,360 182,410 196,444" stroke="#E0AAFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M242,302 C238,360 218,410 204,444" stroke="#E0AAFF" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Polished Silver Lanyard Clip -->
      <circle cx="200" cy="446" r="4.5" fill="#E9ECEF" stroke="#495057" stroke-width="1.5"/>

      <!-- Head Base (Chiseled, Formidable, Mid 50s) -->
      <path d="M148,168 C148,130 252,130 252,168 L252,216 C252,254 228,272 200,272 C172,272 148,254 148,216 Z"
            fill="url(#bernSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Elegant High Cheekbone Contour -->
      <path d="M158,206 C158,226 168,242 178,248" stroke="#C99B82" stroke-width="2" fill="none"/>
      <path d="M242,206 C242,226 232,242 222,248" stroke="#C99B82" stroke-width="2" fill="none"/>

      <!-- Ears with Single Pearl Stud -->
      <ellipse cx="142" cy="204" rx="8" ry="16" fill="#DDAF97" stroke="#4A3228" stroke-width="2"/>
      <circle cx="143" cy="208" r="3.5" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1"/>
      <ellipse cx="258" cy="204" rx="8" ry="16" fill="#DDAF97" stroke="#4A3228" stroke-width="2"/>
      <circle cx="257" cy="208" r="3.5" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1"/>

      <!-- IMMACULATE SILVER-STREAKED CHIGNON (Swept Up Hair) -->
      <path d="M140,172 C134,116 154,88 200,88 C246,88 266,116 260,172 C252,142 238,132 200,132 C162,132 148,142 140,172 Z"
            fill="#212529" stroke="#000000" stroke-width="2"/>
      <!-- High Sculpted Chignon Bun -->
      <ellipse cx="200" cy="74" rx="34" ry="24" fill="#212529" stroke="#000000" stroke-width="2"/>
      <!-- Elegant Silver Streaks -->
      <path d="M168,132 C172,98 184,82 196,62" stroke="#E9ECEF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M178,136 C182,104 192,86 204,64" stroke="#CED4DA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M228,134 C224,106 214,86 204,64" stroke="#E9ECEF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- High, Severe Arched Eyebrows -->
      <path d="M162,176 Q178,164 192,174" stroke="#212529" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M208,174 Q222,164 238,176" stroke="#212529" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Piercing, Intimidating Steel-Grey Eyes -->
      <g>
        <ellipse cx="176" cy="194" rx="8" ry="6" fill="#FFFFFF" stroke="#2B2D42" stroke-width="2"/>
        <circle cx="176" cy="194" r="4.2" fill="#5C677D"/>
        <circle cx="176" cy="194" r="2" fill="#000000"/>
        <circle cx="177" cy="193" r="1.2" fill="#FFFFFF"/>
        <path d="M166,204 Q176,208 186,204" stroke="#C99B82" stroke-width="1.5" fill="none"/>

        <ellipse cx="224" cy="194" rx="8" ry="6" fill="#FFFFFF" stroke="#2B2D42" stroke-width="2"/>
        <circle cx="224" cy="194" r="4.2" fill="#5C677D"/>
        <circle cx="224" cy="194" r="2" fill="#000000"/>
        <circle cx="225" cy="193" r="1.2" fill="#FFFFFF"/>
        <path d="M214,204 Q224,208 234,204" stroke="#C99B82" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Aristocratic Aquiline Nose -->
      <path d="M198,188 L195,218 Q200,222 205,218 L202,188" fill="#C99B82" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Cold, Flat Crimson-Plum Lip (Absolute final statement) -->
      <path d="M184,242 Q200,240 216,242" stroke="#5C1324" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M188,244 Q200,248 212,244" stroke="#800F2F" stroke-width="2" fill="none"/>

      <!-- PROP: MANILA FOLDER WITH RED "PRIVILEGED" STAMP -->
      <g transform="translate(136, 385) rotate(-6)">
        <!-- Folder Body -->
        <rect x="0" y="0" width="138" height="96" rx="3" fill="#E9C46A" stroke="#B08924" stroke-width="2"/>
        <!-- Top Folder Tab -->
        <path d="M0,0 L0,-12 L44,-12 L52,0 Z" fill="#E9C46A" stroke="#B08924" stroke-width="2"/>
        <text x="22" y="-4" font-family="monospace" font-size="6" font-weight="bold" fill="#6B4E04" text-anchor="middle">LEGAL/01</text>

        <!-- Red Rubber Stamp -->
        <g transform="translate(24, 26) rotate(-10)">
          <rect x="0" y="0" width="86" height="32" rx="2" fill="none" stroke="#D90429" stroke-width="2.5" stroke-dasharray="6,2"/>
          <text x="43" y="14" font-family="Arial Black, Impact" font-size="8.5" fill="#D90429" text-anchor="middle">CONFIDENTIAL</text>
          <text x="43" y="26" font-family="Arial Black, Impact" font-size="8" fill="#D90429" text-anchor="middle">PRIVILEGED</text>
        </g>

        <!-- Hand with Gold Bangle Gripping Top Edge -->
        <g transform="translate(80, -2)">
          <!-- Gold Bangle -->
          <ellipse cx="28" cy="18" rx="8" ry="16" fill="#F4A261" stroke="#B07D1C" stroke-width="2.5"/>
          <!-- Fingers -->
          <path d="M10,0 C10,12 24,12 24,0 L18,-4 Z" fill="#F2D5C4" stroke="#4A3228" stroke-width="1.8"/>
          <path d="M22,2 C22,14 36,14 36,2 L30,-2 Z" fill="#F2D5C4" stroke="#4A3228" stroke-width="1.8"/>
        </g>
      </g>

    </g>
  </g>
</svg>