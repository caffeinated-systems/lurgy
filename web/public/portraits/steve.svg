<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- HR Calming Sage/Teal Partition -->
    <linearGradient id="stevePartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E878C"/>
      <stop offset="100%" stop-color="#346266"/>
    </linearGradient>

    <!-- Beige Corduroy Gradient -->
    <linearGradient id="corduroyBeige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5C5AE"/>
      <stop offset="100%" stop-color="#B8A388"/>
    </linearGradient>

    <linearGradient id="steveSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE5D8"/>
      <stop offset="100%" stop-color="#E8BEA6"/>
    </linearGradient>

    <filter id="softShadowSteve" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="mintLanyardGlowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#2EC4B6" flood-opacity="0.6"/>
    </filter>

    <clipPath id="steveClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- HR Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#stevePartition)"/>

    <!-- Commute Saga Post-it -->
    <g transform="translate(48, 110) rotate(-3)">
      <rect width="60" height="48" rx="2" fill="#FFFFFF" stroke="#346266" stroke-width="1"/>
      <rect width="60" height="8" fill="#2EC4B6"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">STEVE'S NEWS</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">THE RING ROAD</text>
      <text x="30" y="29" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">WAS A BOLD CHOICE</text>
      <text x="30" y="40" font-family="Arial" font-size="5" fill="#6C757D" text-anchor="middle">(STEADY AS SHE GOES)</text>
      <circle cx="30" cy="3" r="1.8" fill="#2EC4B6"/>
    </g>

    <!-- CHARACTER: STEVE (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowSteve)">

      <!-- Light-Blue Polo Shirt Base -->
      <path d="M160,300 L240,300 L240,360 L160,360 Z" fill="#A8DADC" stroke="#457B9D" stroke-width="1.5"/>
      <polygon points="166,296 196,334 174,338 152,306" fill="#A8DADC" stroke="#457B9D" stroke-width="1.8"/>
      <polygon points="234,296 204,334 226,338 248,306" fill="#A8DADC" stroke="#457B9D" stroke-width="1.8"/>

      <!-- Beige Corduroy Overshirt -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#corduroyBeige)" stroke="#6A5A44" stroke-width="3"/>

      <!-- Corduroy Rib Lines -->
      <line x1="80" y1="400" x2="80" y2="560" stroke="#9A8367" stroke-width="1.5"/>
      <line x1="110" y1="380" x2="110" y2="560" stroke="#9A8367" stroke-width="1.5"/>
      <line x1="290" y1="380" x2="290" y2="560" stroke="#9A8367" stroke-width="1.5"/>
      <line x1="320" y1="400" x2="320" y2="560" stroke="#9A8367" stroke-width="1.5"/>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#E8BEA6" stroke="#4A3228" stroke-width="2"/>

      <!-- MINT TEAL HR LANYARD -->
      <g filter="url(#mintLanyardGlowS)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#A8F0E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#A8F0E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base (Soft, Harmless, Round Jaw) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,226 C252,264 226,284 200,284 C174,284 148,264 148,226 Z"
            fill="url(#steveSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Ears -->
      <ellipse cx="142" cy="210" rx="9" ry="16" fill="#E8BEA6" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="258" cy="210" rx="9" ry="16" fill="#E8BEA6" stroke="#4A3228" stroke-width="2"/>

      <!-- RECEDING SANDY-BROWN HAIR (Sensible Side Sweep) -->
      <path d="M144,172 C140,136 156,104 200,104 C244,104 260,136 256,172 C248,150 236,142 200,142 C164,142 152,150 144,172 Z"
            fill="#8D6E53" stroke="#4E3B2B" stroke-width="2"/>
      <path d="M166,120 Q200,114 234,124" stroke="#BCA38A" stroke-width="2.5" fill="none"/>

      <!-- Mild, Pleasant Eyebrows -->
      <path d="M162,182 Q174,178 186,182" stroke="#6F523B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M214,182 Q226,178 238,182" stroke="#6F523B" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Gentle, Vacant Friendly Eyes (Ready to nod politely) -->
      <g>
        <ellipse cx="174" cy="198" rx="7.5" ry="6" fill="#FFFFFF"/>
        <circle cx="174" cy="198" r="3.8" fill="#588157"/>
        <circle cx="174" cy="198" r="1.6" fill="#000000"/>
        <circle cx="175" cy="197" r="1.2" fill="#FFFFFF"/>

        <ellipse cx="226" cy="198" rx="7.5" ry="6" fill="#FFFFFF"/>
        <circle cx="226" cy="198" r="3.8" fill="#588157"/>
        <circle cx="226" cy="198" r="1.6" fill="#000000"/>
        <circle cx="227" cy="197" r="1.2" fill="#FFFFFF"/>
      </g>

      <!-- Soft Rounded Nose -->
      <path d="M197,196 L194,222 Q200,226 206,222 L203,196" fill="#D9A890" stroke="#8D5237" stroke-width="1.8"/>

      <!-- Pleasant, Completely Harmless Smile -->
      <path d="M182,248 Q200,258 218,248" stroke="#7A3928" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- PROP: TUPPERWARE WITH PLAIN VICTORIA SPONGE CAKE -->
      <g transform="translate(130, 390)">
        <!-- Plastic Tub (Semi-translucent with blue clips) -->
        <rect x="0" y="8" width="140" height="74" rx="6" fill="#E8F4F8" fill-opacity="0.6" stroke="#457B9D" stroke-width="2"/>
        <!-- Clip-lock latches -->
        <rect x="-4" y="24" width="6" height="14" rx="2" fill="#0077B6"/>
        <rect x="138" y="24" width="6" height="14" rx="2" fill="#0077B6"/>
        <!-- Tub Lid Rim -->
        <rect x="-2" y="4" width="144" height="8" rx="3" fill="#A8DADC" stroke="#457B9D" stroke-width="1.5"/>

        <!-- Plain Square Victoria Sponge Slice Inside -->
        <g transform="translate(42, 22)">
          <!-- Bottom Sponge Layer -->
          <rect x="0" y="24" width="56" height="18" fill="#F4A261" stroke="#E76F51" stroke-width="1"/>
          <!-- Jam & Cream filling line -->
          <line x1="0" y1="24" x2="56" y2="24" stroke="#D62828" stroke-width="3"/>
          <line x1="0" y1="21" x2="56" y2="21" stroke="#FFFFFF" stroke-width="2.5"/>
          <!-- Top Sponge Layer -->
          <rect x="0" y="3" width="56" height="18" fill="#F4A261" stroke="#E76F51" stroke-width="1"/>
          <!-- Dusting of caster sugar -->
          <line x1="2" y1="3" x2="54" y2="3" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,2"/>
        </g>

        <!-- Steve's Friendly Hands Supporting the Tub -->
        <path d="M-4,42 C-10,50 4,60 12,56 L12,42 Z" fill="#FCE5D8" stroke="#4A3228" stroke-width="1.8"/>
        <path d="M144,42 C150,50 136,60 128,56 L128,42 Z" fill="#FCE5D8" stroke="#4A3228" stroke-width="1.8"/>
      </g>

    </g>
  </g>
</svg>