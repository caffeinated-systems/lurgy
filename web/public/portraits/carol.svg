<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- HR Muted Teal Partition -->
    <linearGradient id="hrPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E878C"/>
      <stop offset="100%" stop-color="#346266"/>
    </linearGradient>

    <!-- Lilac Bobble Cardigan Gradient -->
    <linearGradient id="lilacKnit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDB4DB"/>
      <stop offset="100%" stop-color="#A288B0"/>
    </linearGradient>

    <linearGradient id="carolSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE1D4"/>
      <stop offset="100%" stop-color="#EDBFA8"/>
    </linearGradient>

    <filter id="softShadowCarol" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="mintLanyardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#2EC4B6" flood-opacity="0.6"/>
    </filter>

    <clipPath id="carolClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- HR Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#hrPartition)"/>

    <!-- Mandatory Fun Post-it -->
    <g transform="translate(48, 110) rotate(-6)">
      <rect width="52" height="46" fill="#FFD166" stroke="#E0A82E" stroke-width="1"/>
      <text x="26" y="16" font-family="Arial, sans-serif" font-weight="900" font-size="6.5" fill="#594206" text-anchor="middle">REMINDER:</text>
      <text x="26" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#2E2104" text-anchor="middle">Fun is</text>
      <text x="26" y="36" font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="#C92A2A" text-anchor="middle">MANDATORY</text>
      <circle cx="26" cy="4" r="2" fill="#2EC4B6"/>
    </g>

    <!-- CHARACTER: CAROL (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowCarol)">

      <!-- Floral Smock Base -->
      <path d="M150,300 L250,300 L260,370 L140,370 Z" fill="#F7EDE2"/>
      <circle cx="170" cy="330" r="3" fill="#E76F51"/>
      <circle cx="230" cy="330" r="3" fill="#2A9D8F"/>
      <circle cx="200" cy="350" r="3" fill="#E76F51"/>

      <!-- Chunky Lilac Bobble Cardigan -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#lilacKnit)" stroke="#4A3B52" stroke-width="3"/>

      <!-- Bobble Texture Details on Cardigan -->
      <circle cx="100" cy="380" r="4.5" fill="#E8D7F1"/>
      <circle cx="120" cy="410" r="4.5" fill="#E8D7F1"/>
      <circle cx="95" cy="450" r="4.5" fill="#E8D7F1"/>
      <circle cx="300" cy="380" r="4.5" fill="#E8D7F1"/>
      <circle cx="280" cy="410" r="4.5" fill="#E8D7F1"/>
      <circle cx="305" cy="450" r="4.5" fill="#E8D7F1"/>

      <!-- Neck & Chunky Wood Beads -->
      <path d="M168,264 L168,310 C168,326 232,326 232,310 L232,264 Z" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>
      <!-- Wooden Bead Necklace -->
      <path d="M166,294 Q200,326 234,294" stroke="#9C6644" stroke-width="6" stroke-linecap="round" stroke-dasharray="8,2" fill="none"/>

      <!-- MINT TEAL HR LANYARD (With Badges) -->
      <g filter="url(#mintLanyardGlow)">
        <path d="M158,298 C162,356 184,408 196,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 216,408 204,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 184,408 196,442" stroke="#A8F0E8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 216,408 204,442" stroke="#A8F0E8" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Enamel Pins on Lanyard -->
      <circle cx="170" cy="340" r="6" fill="#FFD166" stroke="#212529" stroke-width="1"/>
      <text x="170" y="342" font-family="Arial" font-size="5" font-weight="900" fill="#212529" text-anchor="middle">SMILE</text>
      <circle cx="230" cy="345" r="6" fill="#FF5A5F" stroke="#212529" stroke-width="1"/>
      <text x="230" y="347" font-family="Arial" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">TEAM</text>

      <!-- Head Base -->
      <path d="M144,174 C144,136 256,136 256,174 L256,226 C256,264 228,284 200,284 C172,284 144,264 144,226 Z"
            fill="url(#carolSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Carol's Permed Curled Bob Hair (Caramel brown) -->
      <path d="M132,188 C122,140 144,98 200,98 C256,98 278,140 268,188 C278,198 280,228 266,236 C258,212 256,180 256,180 C242,160 220,154 200,154 C170,154 154,166 144,180 C144,180 142,212 134,236 C120,228 122,198 132,188 Z"
            fill="#8B5E3C" stroke="#3D2314" stroke-width="2.5"/>
      <circle cx="132" cy="180" r="10" fill="#A06D46"/>
      <circle cx="268" cy="180" r="10" fill="#A06D46"/>

      <!-- Ears -->
      <ellipse cx="140" cy="210" rx="9" ry="16" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="260" cy="210" rx="9" ry="16" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>

      <!-- Wide, Maternal, Unblinking Eyes (Aggressively Friendly) -->
      <g>
        <ellipse cx="174" cy="200" rx="10" ry="9" fill="#FFFFFF" stroke="#332219" stroke-width="2"/>
        <circle cx="174" cy="200" r="4.5" fill="#588157"/>
        <circle cx="174" cy="200" r="2" fill="#000000"/>
        <circle cx="176" cy="198" r="1.5" fill="#FFFFFF"/>

        <ellipse cx="226" cy="200" rx="10" ry="9" fill="#FFFFFF" stroke="#332219" stroke-width="2"/>
        <circle cx="226" cy="200" r="4.5" fill="#588157"/>
        <circle cx="226" cy="200" r="2" fill="#000000"/>
        <circle cx="228" cy="198" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Cat-Eye Reading Glasses (Low on nose) -->
      <g transform="translate(0, 4)">
        <path d="M156,198 Q174,212 190,198 Q174,192 156,198 Z" fill="none" stroke="#934B00" stroke-width="3.5"/>
        <path d="M210,198 Q226,212 244,198 Q226,192 210,198 Z" fill="none" stroke="#934B00" stroke-width="3.5"/>
        <line x1="190" y1="202" x2="210" y2="202" stroke="#934B00" stroke-width="3"/>
        <!-- Glasses corner wings -->
        <polygon points="156,198 152,192 158,194" fill="#934B00"/>
        <polygon points="244,198 248,192 242,194" fill="#934B00"/>
      </g>

      <!-- Eyebrows (Arched, high, enthusiastic) -->
      <path d="M162,180 Q174,172 188,180" stroke="#5E3B21" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M212,180 Q226,172 238,180" stroke="#5E3B21" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Weaponized Wide Cheerful Smile -->
      <path d="M174,244 Q200,268 226,244 Z" fill="#9E2A2B" stroke="#4A1213" stroke-width="2"/>
      <path d="M178,244 Q200,252 222,244" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/> <!-- Teeth -->
      <!-- Apple Cheeks -->
      <circle cx="164" cy="226" r="12" fill="#FF758F" opacity="0.4"/>
      <circle cx="236" cy="226" r="12" fill="#FF758F" opacity="0.4"/>

      <!-- PROP: LAMINATED ICE-BREAKER BINDER (Held to chest) -->
      <g transform="translate(116, 400) rotate(-4)">
        <!-- White Ring Binder -->
        <rect width="168" height="100" rx="4" fill="#F8F9FA" stroke="#6C757D" stroke-width="2.5"/>
        <!-- Spine edge -->
        <rect width="18" height="100" rx="2" fill="#2EC4B6"/>
        <!-- Label Insert -->
        <rect x="32" y="24" width="120" height="52" rx="2" fill="#E8F8F5" stroke="#2EC4B6" stroke-width="1.5"/>
        <text x="92" y="44" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#1D3557" text-anchor="middle">ICE-BREAKERS</text>
        <text x="92" y="62" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#E63946" text-anchor="middle">(MANDATORY)</text>
      </g>

      <!-- Hands Gripping Binder from Sides -->
      <g>
        <!-- Left Hand -->
        <path d="M102,426 C96,444 112,460 126,456 L134,430 Z" fill="#FCE1D4" stroke="#4A3228" stroke-width="2"/>
        <!-- Right Hand -->
        <path d="M298,426 C304,444 288,460 274,456 L266,430 Z" fill="#FCE1D4" stroke="#4A3228" stroke-width="2"/>
      </g>

    </g>
  </g>
</svg>