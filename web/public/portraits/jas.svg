<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- HR Calming Sage/Teal Partition -->
    <linearGradient id="jasPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E878C"/>
      <stop offset="100%" stop-color="#346266"/>
    </linearGradient>

    <!-- Boxy Mint Blazer Gradient -->
    <linearGradient id="mintBlazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7C4B5"/>
      <stop offset="100%" stop-color="#7B9E8D"/>
    </linearGradient>

    <!-- South Asian Skin Tone Gradient -->
    <linearGradient id="jasSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDA17B"/>
      <stop offset="100%" stop-color="#BC7F57"/>
    </linearGradient>

    <filter id="softShadowJas" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="mintLanyardGlowJ" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#2EC4B6" flood-opacity="0.6"/>
    </filter>

    <clipPath id="jasClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- HR Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#jasPartition)"/>

    <!-- Vibe Check Post-it Note -->
    <g transform="translate(48, 110) rotate(-5)">
      <rect width="58" height="48" rx="2" fill="#E8F8F5" stroke="#2EC4B6" stroke-width="1.2"/>
      <rect width="58" height="8" fill="#2EC4B6"/>
      <text x="29" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">HR POLICY UPDATE</text>
      <text x="29" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">ANNUAL REVIEW?</text>
      <text x="29" y="30" font-family="Arial Black, Impact" font-size="6.5" fill="#006D77" text-anchor="middle">IT'S A VIBE CHECK</text>
      <text x="29" y="42" font-family="Arial" font-size="5" font-weight="bold" fill="#E63946" text-anchor="middle">NO NOTES. SLAY.</text>
      <circle cx="29" cy="3" r="1.8" fill="#2EC4B6"/>
    </g>

    <!-- CHARACTER: JAS (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowJas)">

      <!-- White Baby-Tee Underneath -->
      <path d="M160,300 L240,300 L240,360 L160,360 Z" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1.5"/>

      <!-- Oversized Boxy Mint Blazer -->
      <path d="M46,560 L48,490 L58,374 C64,328 104,304 154,298 L246,298 C296,304 336,328 342,374 L352,490 L354,560 Z"
            fill="url(#mintBlazer)" stroke="#4A6B5D" stroke-width="3"/>

      <!-- Blazer Lapels -->
      <path d="M154,298 L130,370 L176,440 L200,440 L164,298 Z" fill="#BED6CB" stroke="#4A6B5D" stroke-width="2"/>
      <path d="M246,298 L270,370 L224,440 L200,440 L236,298 Z" fill="#BED6CB" stroke="#4A6B5D" stroke-width="2"/>

      <!-- Layered Gold Chain Necklaces -->
      <path d="M174,290 Q200,314 226,290" fill="none" stroke="#F4A261" stroke-width="3"/>
      <path d="M168,296 Q200,326 232,296" fill="none" stroke="#E76F51" stroke-width="2"/>

      <!-- Neck -->
      <path d="M170,258 L170,306 C170,322 230,322 230,306 L230,258 Z" fill="#BC7F57" stroke="#4A3228" stroke-width="2"/>

      <!-- MINT TEAL HR LANYARD -->
      <g filter="url(#mintLanyardGlowJ)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#2EC4B6" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#A8F0E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#A8F0E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,280 200,280 C174,280 148,260 148,222 Z"
            fill="url(#jasSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Cheek Highlighter Glow -->
      <ellipse cx="162" cy="208" rx="8" ry="5" fill="#FFE8D6" opacity="0.6"/>
      <ellipse cx="238" cy="208" rx="8" ry="5" fill="#FFE8D6" opacity="0.6"/>

      <!-- Statement Resin Geometric Earrings -->
      <polygon points="138,214 144,228 132,228" fill="#F4A261" stroke="#9A3412" stroke-width="1.5"/>
      <polygon points="262,214 268,228 256,228" fill="#F4A261" stroke="#9A3412" stroke-width="1.5"/>

      <!-- GLOSSY BOX BRAIDS WITH GOLD HAIR CUFFS -->
      <path d="M140,174 C132,120 152,86 200,86 C248,86 268,120 260,174 C268,210 266,258 256,268 C248,240 248,190 248,190 C234,148 222,140 200,140 C178,140 166,148 152,190 C152,190 152,240 144,268 C134,258 132,210 140,174 Z"
            fill="#1A1513" stroke="#000000" stroke-width="2.5"/>
      <!-- Individual braid lines & gold cuffs -->
      <line x1="148" y1="180" x2="142" y2="260" stroke="#000000" stroke-width="4"/>
      <rect x="140" y="220" width="5" height="6" rx="1" fill="#F4A261"/>
      <line x1="252" y1="180" x2="258" y2="260" stroke="#000000" stroke-width="4"/>
      <rect x="255" y="220" width="5" height="6" rx="1" fill="#F4A261"/>

      <!-- SASSY ASYMMETRICAL EYEBROWS (One raised high) -->
      <path d="M160,180 Q174,174 188,180" stroke="#1A1513" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,170 Q226,158 240,168" stroke="#1A1513" stroke-width="3.5" fill="none" stroke-linecap="round"/> <!-- Raised -->

      <!-- Knowing Dark Brown Eyes -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="174" cy="196" r="4.2" fill="#3D2314"/>
        <circle cx="174" cy="196" r="1.8" fill="#000000"/>
        <circle cx="175.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
        <path d="M182,194 L188,188" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

        <ellipse cx="226" cy="194" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="226" cy="194" r="4.2" fill="#3D2314"/>
        <circle cx="226" cy="194" r="1.8" fill="#000000"/>
        <circle cx="227.5" cy="192.5" r="1.2" fill="#FFFFFF"/>
        <path d="M234,192 L240,186" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Nose -->
      <path d="M197,194 L194,220 Q200,224 206,220 L203,194" fill="#A86A41" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Knowing Smirk with Glossy Lip Tint -->
      <path d="M180,248 Q200,246 222,238" stroke="#9A3412" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M184,248 Q200,254 220,242" stroke="#E76F51" stroke-width="2" fill="none"/>

      <!-- PROP: ICED MATCHA LATTE GLASS TUMBLER -->
      <g transform="translate(224, 370) rotate(-6)">
        <!-- Clear Glass Cup Body -->
        <polygon points="6,10 12,84 46,84 52,10" fill="#E8F8F5" fill-opacity="0.3" stroke="#52B788" stroke-width="2"/>
        <!-- Vibrant Green Matcha Layer -->
        <polygon points="8,32 12,84 46,84 50,32" fill="#52B788"/>
        <!-- Milk Swirl Gradient Top -->
        <ellipse cx="29" cy="32" rx="21" ry="5" fill="#D8F3DC"/>
        <!-- Ice Cubes inside -->
        <rect x="18" y="40" width="10" height="10" rx="2" fill="#FFFFFF" fill-opacity="0.7"/>
        <rect x="30" y="52" width="10" height="10" rx="2" fill="#FFFFFF" fill-opacity="0.7"/>
        <!-- Glass Straw -->
        <line x1="28" y1="0" x2="34" y2="76" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

        <!-- Hand with Chic Nude Manicure Cradling Tumbler -->
        <g transform="translate(18, 40)">
          <path d="M26,-6 C30,4 30,16 26,26 L16,26 C20,16 20,4 16,-6 Z" fill="#DDA17B" stroke="#4A3228" stroke-width="1.8"/>
        </g>
      </g>

    </g>
  </g>
</svg>