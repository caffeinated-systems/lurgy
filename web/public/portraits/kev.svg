<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- IT Slate-Cyan Partition -->
    <linearGradient id="kevPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#587B87"/>
      <stop offset="100%" stop-color="#3E5A64"/>
    </linearGradient>

    <!-- Grey Microfleece -->
    <linearGradient id="kevFleece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C757D"/>
      <stop offset="100%" stop-color="#495057"/>
    </linearGradient>

    <linearGradient id="kevSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAC0A2"/>
      <stop offset="100%" stop-color="#D49E7C"/>
    </linearGradient>

    <!-- Neon Can Gradient -->
    <linearGradient id="canGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38B000"/>
      <stop offset="40%" stop-color="#70E000"/>
      <stop offset="70%" stop-color="#CCFF33"/>
      <stop offset="100%" stop-color="#38B000"/>
    </linearGradient>

    <filter id="softShadowK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="neonBlueGlowK" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>

    <clipPath id="kevClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- IT Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#kevPartition)"/>

    <!-- Yoghurt Grievance Note -->
    <g transform="translate(48, 110) rotate(-6)">
      <rect width="56" height="48" rx="2" fill="#FFF3B0" stroke="#D4A373" stroke-width="1"/>
      <rect width="56" height="8" fill="#E63946"/>
      <text x="28" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">STOLEN PROPERTY</text>
      <text x="28" y="19" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">WHO TOOK MY</text>
      <text x="28" y="29" font-family="Arial, sans-serif" font-weight="900" font-size="6.5" fill="#C92A2A" text-anchor="middle">MÜLLER CORNER?</text>
      <text x="28" y="41" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#6C757D" text-anchor="middle">I HAVE LOGS.</text>
      <circle cx="28" cy="3" r="1.8" fill="#E63946"/>
    </g>

    <!-- CHARACTER: KEV (Shifted up, conspiratorial forward lean) -->
    <g transform="translate(0, -54)" filter="url(#softShadowK)">

      <!-- Grey Zip Microfleece -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#kevFleece)" stroke="#212529" stroke-width="3"/>

      <!-- Faded Black Vintage Tech Tee V -->
      <polygon points="170,302 230,302 200,430" fill="#212529" stroke="#111315" stroke-width="2"/>
      <!-- Faded 2008 Conference Logo -->
      <path d="M185,340 L215,340 L200,365 Z" fill="#495057" opacity="0.6"/>
      <text x="200" y="375" font-family="monospace" font-size="6" fill="#6C757D" text-anchor="middle">SYS-CON 08</text>

      <!-- Fleece Center Zipper -->
      <line x1="200" y1="430" x2="200" y2="560" stroke="#ADB5BD" stroke-width="3.5"/>

      <!-- Neck & Lean -->
      <path d="M168,260 L168,310 C168,326 232,326 232,310 L232,260 Z" fill="#D49E7C" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="200" cy="282" rx="32" ry="12" fill="#B37754" opacity="0.6"/>

      <!-- NEON BLUE IT LANYARD -->
      <g filter="url(#neonBlueGlowK)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base -->
      <path d="M146,172 C146,134 254,134 254,172 L254,226 C254,264 228,286 200,286 C172,286 146,264 146,226 Z"
            fill="url(#kevSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Ears -->
      <ellipse cx="140" cy="210" rx="9" ry="17" fill="#D49E7C" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="260" cy="210" rx="9" ry="17" fill="#D49E7C" stroke="#4A3228" stroke-width="2"/>

      <!-- Receding Spiked 2000s Hair -->
      <path d="M144,170 C140,128 154,104 176,96 C180,94 186,84 192,94 C198,82 206,82 210,94 C216,84 224,94 228,96 C248,104 260,128 256,170 C246,146 230,136 200,136 C170,136 154,146 144,170 Z"
            fill="#5C4033" stroke="#2B1810" stroke-width="2"/>
      <!-- Spiked Gel Clumps -->
      <polygon points="186,90 190,74 196,90" fill="#5C4033" stroke="#2B1810" stroke-width="1.5"/>
      <polygon points="198,86 202,68 208,86" fill="#5C4033" stroke="#2B1810" stroke-width="1.5"/>
      <polygon points="210,90 216,74 220,90" fill="#5C4033" stroke="#2B1810" stroke-width="1.5"/>

      <!-- Dark Circles & Sleep-Deprived Bags -->
      <ellipse cx="174" cy="204" rx="14" ry="7" fill="#8D5B4C" opacity="0.45"/>
      <ellipse cx="226" cy="204" rx="14" ry="7" fill="#8D5B4C" opacity="0.45"/>

      <!-- Bloodshot Paranoid Eyes (Uneven, manic focus) -->
      <g>
        <!-- Left eye wider, suspicious -->
        <ellipse cx="174" cy="198" rx="8" ry="7" fill="#FFFFFF" stroke="#3A2218" stroke-width="2"/>
        <circle cx="174" cy="198" r="3.5" fill="#4B382A"/>
        <circle cx="174" cy="198" r="1.5" fill="#000000"/>
        <!-- Red bloodshot vein -->
        <path d="M168,198 Q171,196 172,199" stroke="#E63946" stroke-width="1" fill="none"/>

        <!-- Right eye slightly squinted, conspiratorial -->
        <ellipse cx="226" cy="199" rx="8" ry="5.5" fill="#FFFFFF" stroke="#3A2218" stroke-width="2"/>
        <circle cx="226" cy="199" r="3" fill="#4B382A"/>
        <circle cx="226" cy="199" r="1.5" fill="#000000"/>
        <path d="M229,199 Q232,197 233,200" stroke="#E63946" stroke-width="1" fill="none"/>
      </g>

      <!-- Asymmetrical Suspicious Eyebrows -->
      <path d="M160,182 Q174,172 188,184" stroke="#3D261D" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M212,186 Q226,180 240,182" stroke="#3D261D" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Nose (Narrow, twitchy) -->
      <path d="M197,196 L194,224 Q200,228 206,224 L203,196" fill="#C28766" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Goatee & Moustache (Neat early-2000s ring) -->
      <path d="M178,240 C178,266 186,276 200,276 C214,276 222,266 222,240 C214,244 208,245 200,245 C192,245 186,244 178,240 Z"
            fill="#3D261D" stroke="#1F130E" stroke-width="1.8"/>
      <!-- Mouth inside goatee (Tight, scheming smirk) -->
      <path d="M186,252 Q196,258 214,250" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- PROP: CRUSHED NEON GREEN ENERGY DRINK CAN -->
      <g transform="translate(230, 370) rotate(-12)">
        <!-- Can Body -->
        <rect x="0" y="0" width="46" height="88" rx="6" fill="url(#canGrad)" stroke="#1B4332" stroke-width="2"/>
        <!-- Silver Rim & Base -->
        <ellipse cx="23" cy="4" rx="20" ry="4" fill="#D8F3DC" stroke="#74C69D" stroke-width="1.5"/>
        <ellipse cx="23" cy="84" rx="20" ry="4" fill="#74C69D"/>
        <!-- Aggressive Slash Logo -->
        <path d="M12,20 L34,26 L16,50 L36,54" stroke="#081C15" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <text x="23" y="74" font-family="Arial Black, Impact" font-size="7" fill="#081C15" text-anchor="middle">VOLT</text>

        <!-- Kev's Tense Hand Gripping the Can -->
        <path d="M-6,30 C-10,38 -2,48 10,46" stroke="#D49E7C" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M-6,44 C-10,52 -2,60 10,58" stroke="#D49E7C" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M-6,58 C-10,66 -2,74 10,72" stroke="#D49E7C" stroke-width="7" stroke-linecap="round" fill="none"/>
      </g>

    </g>
  </g>
</svg>