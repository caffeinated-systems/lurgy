<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Customer Services Muted Mauve Partition -->
    <linearGradient id="keishaPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#726284"/>
      <stop offset="100%" stop-color="#4B3F58"/>
    </linearGradient>

    <!-- Plum Blazer Gradient -->
    <linearGradient id="plumBlazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B2D5B"/>
      <stop offset="100%" stop-color="#541B3D"/>
    </linearGradient>

    <!-- Warm Honey Skin Tone Gradient -->
    <linearGradient id="keishaSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDA17B"/>
      <stop offset="100%" stop-color="#BA7A52"/>
    </linearGradient>

    <filter id="softShadowKeisha" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="lavenderLanyardGlowK" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#C77DFF" flood-opacity="0.6"/>
    </filter>

    <clipPath id="keishaClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- CS Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#keishaPartition)"/>

    <!-- Call Center Hold Time Note -->
    <g transform="translate(48, 110) rotate(-4)">
      <rect width="60" height="48" rx="2" fill="#FFFFFF" stroke="#4B3F58" stroke-width="1"/>
      <rect width="60" height="8" fill="#C77DFF"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">CALL DISPATCH</text>
      <text x="30" y="19" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">CALLER CALLED</text>
      <text x="30" y="27" font-family="Arial Black, Impact" font-size="6" fill="#7B2D5B" text-anchor="middle">ME "DARLING"</text>
      <text x="30" y="40" font-family="monospace" font-size="5" font-weight="bold" fill="#D90429" text-anchor="middle">HOLD: FOREVER</text>
      <circle cx="30" cy="3" r="1.8" fill="#C77DFF"/>
    </g>

    <!-- CHARACTER: KEISHA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowKeisha)">

      <!-- Black Scoop-Neck Tee -->
      <path d="M160,300 L240,300 L240,380 L160,380 Z" fill="#161718" stroke="#000000" stroke-width="1.5"/>

      <!-- Plum Tailored Blazer -->
      <path d="M50,560 L52,490 L60,374 C66,328 106,306 156,300 L244,300 C294,306 334,328 340,374 L348,490 L350,560 Z"
            fill="url(#plumBlazer)" stroke="#381028" stroke-width="3"/>

      <!-- Blazer Lapels -->
      <path d="M156,300 L134,370 L180,440 L200,440 L166,300 Z" fill="#93396F" stroke="#381028" stroke-width="2"/>
      <path d="M244,300 L266,370 L220,440 L200,440 L234,300 Z" fill="#93396F" stroke="#381028" stroke-width="2"/>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#BA7A52" stroke="#4A3228" stroke-width="2"/>

      <!-- LAVENDER ORCHID CS LANYARD -->
      <g filter="url(#lavenderLanyardGlowK)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#C77DFF" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#C77DFF" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#F1D8FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#F1D8FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base (Warm, Elegant) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,280 200,280 C174,280 148,260 148,222 Z"
            fill="url(#keishaSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Gold Chunky Hoop Earrings -->
      <circle cx="138" cy="214" r="11" fill="none" stroke="#F4A261" stroke-width="3.5"/>
      <circle cx="262" cy="214" r="11" fill="none" stroke="#F4A261" stroke-width="3.5"/>

      <!-- Ears -->
      <ellipse cx="142" cy="206" rx="8" ry="16" fill="#BA7A52" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="258" cy="206" rx="8" ry="16" fill="#BA7A52" stroke="#4A3228" stroke-width="2"/>

      <!-- DREADLOCKS HIGH BUN (Polished Updo) -->
      <path d="M142,172 C134,120 154,86 200,86 C246,86 266,120 258,172 C250,146 236,136 200,136 C164,136 150,146 142,172 Z"
            fill="#1E140F" stroke="#0A0705" stroke-width="2.5"/>
      <!-- High Sculpted Dreadlock Top-Knot Bun -->
      <ellipse cx="200" cy="74" rx="32" ry="24" fill="#1E140F" stroke="#0A0705" stroke-width="2"/>
      <!-- Dreadlock Rib Detail Lines -->
      <line x1="184" y1="60" x2="184" y2="88" stroke="#3D291E" stroke-width="3"/>
      <line x1="200" y1="56" x2="200" y2="92" stroke="#3D291E" stroke-width="3"/>
      <line x1="216" y1="60" x2="216" y2="88" stroke="#3D291E" stroke-width="3"/>

      <!-- Sculpted Eyebrows -->
      <path d="M160,178 Q174,168 188,176" stroke="#1E140F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,176 Q226,168 240,178" stroke="#1E140F" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Warm Brown Eyes with Hidden Sarcastic Fury -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="174" cy="196" r="4.2" fill="#4A2810"/>
        <circle cx="174" cy="196" r="1.8" fill="#000000"/>
        <circle cx="175.5" cy="194.5" r="1.2" fill="#FFFFFF"/>

        <ellipse cx="226" cy="196" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="226" cy="196" r="4.2" fill="#4A2810"/>
        <circle cx="226" cy="196" r="1.8" fill="#000000"/>
        <circle cx="227.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
      </g>

      <!-- Nose -->
      <path d="M198,194 L195,220 Q200,224 205,220 L202,194" fill="#A66841" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Sweet Rehearsed "Customer Service" Smile (Berry Gloss) -->
      <path d="M178,244 Q200,266 222,244 Z" fill="#9D0208" stroke="#540B0E" stroke-width="2"/>
      <path d="M182,244 Q200,250 218,244" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- PROP: CALL-CENTRE HEADSET (Draped around neck like a boxer's towel) -->
      <g transform="translate(136, 274)">
        <!-- Headset Neck Band Arch -->
        <path d="M10,0 Q64,30 128,0" fill="none" stroke="#2B2D2F" stroke-width="5" stroke-linecap="round"/>
        <!-- Right Ear Cushion Piece -->
        <rect x="124" y="-8" width="14" height="20" rx="4" fill="#1C1E20" stroke="#000000" stroke-width="1.5"/>
        <!-- Long Curved Microphone Boom Arm -->
        <path d="M130,12 Q140,50 96,74" fill="none" stroke="#6C757D" stroke-width="3" stroke-linecap="round"/>
        <!-- Foam Mic Tip -->
        <ellipse cx="94" cy="74" rx="5" ry="4" fill="#111213"/>
      </g>

    </g>
  </g>
</svg>