<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Marketing Dusty Terracotta Partition -->
    <linearGradient id="millaPartitionBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E6464"/>
      <stop offset="100%" stop-color="#703E3E"/>
    </linearGradient>

    <!-- Terracotta Mock-Neck Gradient -->
    <linearGradient id="terracottaKnitM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D96B43"/>
      <stop offset="100%" stop-color="#A8431D"/>
    </linearGradient>

    <linearGradient id="millaSkinM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE5D8"/>
      <stop offset="100%" stop-color="#EABCA4"/>
    </linearGradient>

    <!-- Milla Light Brown Hair Gradient -->
    <linearGradient id="millaLightBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BA875E"/>
      <stop offset="50%" stop-color="#9C6B43"/>
      <stop offset="100%" stop-color="#6E4424"/>
    </linearGradient>

    <filter id="softShadowMillaB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="coralLanyardGlowMB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FF5A5F" flood-opacity="0.6"/>
    </filter>

    <clipPath id="millaClipB">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Marketing Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#millaPartitionBrown)"/>

    <!-- Rebranding Mission Post-it -->
    <g transform="translate(48, 110) rotate(-4)">
      <rect width="60" height="48" rx="2" fill="#E0FBFC" stroke="#3D5A80" stroke-width="1"/>
      <rect width="60" height="8" fill="#3D5A80"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">BRAND STRATEGY</text>
      <text x="30" y="19" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">STATIONERY CUPBOARD</text>
      <text x="30" y="27" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">IS NOW A</text>
      <text x="30" y="38" font-family="Arial Black, Impact" font-size="5.5" fill="#E63946" text-anchor="middle">RESOURCE HUB</text>
      <circle cx="30" cy="3" r="1.8" fill="#3D5A80"/>
    </g>

    <!-- CHARACTER: MILLA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowMillaB)">

      <!-- Terracotta Ribbed Mock-Neck Sweater -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#terracottaKnitM)" stroke="#5E230C" stroke-width="3"/>

      <!-- Ribbed Texture Lines -->
      <line x1="80" y1="400" x2="80" y2="560" stroke="#8C3513" stroke-width="2"/>
      <line x1="110" y1="380" x2="110" y2="560" stroke="#8C3513" stroke-width="2"/>
      <line x1="290" y1="380" x2="290" y2="560" stroke="#8C3513" stroke-width="2"/>
      <line x1="320" y1="400" x2="320" y2="560" stroke="#8C3513" stroke-width="2"/>

      <!-- High Mock-Neck Collar -->
      <path d="M164,252 L164,308 C164,324 236,324 236,308 L236,252 Z" fill="#D96B43" stroke="#5E230C" stroke-width="2.5"/>
      <line x1="166" y1="274" x2="234" y2="274" stroke="#8C3513" stroke-width="1.5"/>
      <line x1="166" y1="292" x2="234" y2="292" stroke="#8C3513" stroke-width="1.5"/>

      <!-- VIBRANT CORAL PINK MARKETING LANYARD -->
      <g filter="url(#coralLanyardGlowMB)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#FF5A5F" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#FF5A5F" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#FFD8D9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#FFD8D9" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,280 200,280 C174,280 148,260 148,222 Z"
            fill="url(#millaSkinM)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Chunky Acetate Statement Earring -->
      <ellipse cx="258" cy="206" rx="8" ry="16" fill="#EABCA4" stroke="#4A3228" stroke-width="2"/>
      <circle cx="260" cy="226" r="8" fill="#2A9D8F" stroke="#1D685F" stroke-width="2"/>

      <!-- LIGHT BROWN ASYMMETRICAL RAZOR BOB -->
      <path d="M136,176 C130,118 152,86 200,86 C248,86 266,118 262,176 C262,190 258,210 256,220 C246,160 236,140 200,140 C162,140 146,150 134,250 C128,210 130,190 136,176 Z"
            fill="url(#millaLightBrown)" stroke="#4A2C14" stroke-width="2.5"/>
      <!-- Soft Caramel Highlights on Bob -->
      <path d="M146,144 Q200,136 250,148 L248,160 Q200,150 144,158 Z" fill="#D4A076" opacity="0.45"/>
      <path d="M148,170 L136,240" stroke="#D4A076" stroke-width="2" opacity="0.6"/>

      <!-- Warm Brown Eyebrows -->
      <path d="M162,178 Q174,170 188,178" stroke="#5C3518" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M212,178 Q226,170 238,178" stroke="#5C3518" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Earnest, Trend-Evaluating Dark Eyes -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="6.5" fill="#FFFFFF" stroke="#1A1C1E" stroke-width="1.8"/>
        <circle cx="174" cy="196" r="4.2" fill="#2E1C11"/>
        <circle cx="174" cy="196" r="1.8" fill="#000000"/>
        <circle cx="175.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
        <path d="M182,194 L190,188" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

        <ellipse cx="226" cy="196" rx="8" ry="6.5" fill="#FFFFFF" stroke="#1A1C1E" stroke-width="1.8"/>
        <circle cx="226" cy="196" r="4.2" fill="#2E1C11"/>
        <circle cx="226" cy="196" r="1.8" fill="#000000"/>
        <circle cx="227.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
        <path d="M234,194 L242,188" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- OVERSIZED DESIGNER TORTOISESHELL GLASSES -->
      <g>
        <rect x="156" y="184" width="34" height="26" rx="6" fill="#F4A261" fill-opacity="0.1" stroke="#4A2810" stroke-width="3.5"/>
        <rect x="156" y="184" width="34" height="26" rx="6" fill="none" stroke="#DDA15E" stroke-width="1.5" stroke-dasharray="6,4"/>

        <rect x="210" y="184" width="34" height="26" rx="6" fill="#F4A261" fill-opacity="0.1" stroke="#4A2810" stroke-width="3.5"/>
        <rect x="210" y="184" width="34" height="26" rx="6" fill="none" stroke="#DDA15E" stroke-width="1.5" stroke-dasharray="6,4"/>

        <path d="M190,192 Q200,188 210,192" stroke="#4A2810" stroke-width="3.5" fill="none"/>
      </g>

      <!-- Nose -->
      <path d="M197,196 L195,220 Q200,224 205,220 L203,196" fill="#D99F84" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Neutral, Deeply Earnest Lips -->
      <path d="M182,246 Q200,248 218,246" stroke="#9A5844" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M186,246 Q200,250 214,246" stroke="#B8735C" stroke-width="2" fill="none"/>

      <!-- PROP: MINIMALIST CERAMIC TRAVEL TUMBLER ("SYNERGY") -->
      <g transform="translate(136, 386) rotate(-4)">
        <polygon points="6,12 12,82 46,82 52,12" fill="#E9ECEF" stroke="#495057" stroke-width="2"/>
        <rect x="10" y="38" width="38" height="14" rx="1" fill="#212529" stroke="#000000" stroke-width="1"/>
        <text x="29" y="48" font-family="'Courier New', monospace" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">SYNERGY</text>
        <rect x="4" y="4" width="50" height="10" rx="3" fill="#D4A373" stroke="#8C5828" stroke-width="2"/>

        <g transform="translate(20, 48)">
          <path d="M22,-4 C26,4 26,16 22,24 L14,24 C18,16 18,4 14,-4 Z" fill="#FCE5D8" stroke="#4A3228" stroke-width="1.8"/>
        </g>
      </g>

    </g>
  </g>
</svg>