<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Sales Burgundy Partition -->
    <linearGradient id="nadiaPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#723344"/>
      <stop offset="100%" stop-color="#441C27"/>
    </linearGradient>

    <!-- Cream Power Vest Gradient -->
    <linearGradient id="creamVest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#DEE2E6"/>
    </linearGradient>

    <linearGradient id="nadiaSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE1D4"/>
      <stop offset="100%" stop-color="#E2A68C"/>
    </linearGradient>

    <!-- Gold Pen Gradient -->
    <linearGradient id="goldPenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="50%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>

    <filter id="softShadowNadia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="crimsonLanyardGlowN" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E63946" flood-opacity="0.6"/>
    </filter>

    <clipPath id="nadiaClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Sales Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#nadiaPartition)"/>

    <!-- Self-Motivational Poster Pinned to Screen -->
    <g transform="translate(48, 110) rotate(3)">
      <rect width="60" height="52" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
      <!-- Tiny Nadia Avatar -->
      <rect x="6" y="6" width="48" height="24" fill="#1C1F22"/>
      <circle cx="30" cy="16" r="6" fill="#FCE1D4"/>
      <text x="30" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#E63946" text-anchor="middle">QUOTE OF THE DAY</text>
      <text x="30" y="46" font-family="Arial" font-size="4.5" font-weight="bold" fill="#212529" text-anchor="middle">LINDA CAN'T CLOSE FOREVER</text>
      <circle cx="30" cy="3" r="1.8" fill="#E63946"/>
    </g>

    <!-- CHARACTER: NADIA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowNadia)">

      <!-- Black Ribbed Polo Knit Base -->
      <path d="M150,300 L250,300 L250,420 L150,420 Z" fill="#1A1C1E" stroke="#000000" stroke-width="2"/>
      <!-- Polo Collar -->
      <polygon points="160,296 198,336 170,342 148,306" fill="#2B3035" stroke="#000000" stroke-width="1.8"/>
      <polygon points="240,296 202,336 230,342 252,306" fill="#2B3035" stroke="#000000" stroke-width="1.8"/>

      <!-- Structured Cream Tailored Power Vest -->
      <path d="M50,560 L52,490 L60,374 C66,328 106,306 156,300 L244,300 C294,306 334,328 340,374 L348,490 L350,560 Z"
            fill="url(#creamVest)" stroke="#495057" stroke-width="3"/>

      <!-- Power Vest Peak Lapels -->
      <path d="M156,300 L132,366 L178,440 L200,440 L166,300 Z" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="2"/>
      <path d="M244,300 L268,366 L222,440 L200,440 L234,300 Z" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="2"/>

      <!-- Gold Snake-Chain Necklace -->
      <path d="M174,290 Q200,314 226,290" fill="none" stroke="#F4A261" stroke-width="3"/>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#E2A68C" stroke="#4A3228" stroke-width="2"/>

      <!-- CLARET CRIMSON SALES LANYARD -->
      <g filter="url(#crimsonLanyardGlowN)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base (Razor Cheekbones) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,220 C252,258 226,278 200,278 C174,278 148,258 148,220 Z"
            fill="url(#nadiaSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Sharp Cheekbone Contour -->
      <path d="M156,206 C158,226 168,238 178,244" stroke="#C97E5E" stroke-width="2.5" fill="none"/>
      <path d="M244,206 C242,226 232,238 222,244" stroke="#C97E5E" stroke-width="2.5" fill="none"/>

      <!-- Ears with Gold Bar Studs -->
      <ellipse cx="142" cy="206" rx="8" ry="16" fill="#E2A68C" stroke="#4A3228" stroke-width="2"/>
      <rect x="140" y="206" width="3" height="8" rx="1" fill="#F4A261"/>
      <ellipse cx="258" cy="206" rx="8" ry="16" fill="#E2A68C" stroke="#4A3228" stroke-width="2"/>
      <rect x="257" y="206" width="3" height="8" rx="1" fill="#F4A261"/>

      <!-- SLEEK HIGH PONYTAIL (Pulled Drum-Tight) -->
      <path d="M144,172 C140,118 160,86 200,86 C240,86 260,118 256,172 C248,142 236,132 200,132 C164,132 152,142 144,172 Z"
            fill="#1E1612" stroke="#0A0705" stroke-width="2"/>
      <!-- Ponytail Base at Crown -->
      <circle cx="200" cy="74" r="8" fill="#F4A261"/> <!-- Gold hair cuff -->
      <!-- Long Sleek Ponytail cascading behind shoulder -->
      <path d="M204,74 C240,68 280,110 286,220 C288,240 274,250 268,220 C264,140 234,84 200,78 Z"
            fill="#1E1612" stroke="#0A0705" stroke-width="2"/>

      <!-- High, Razor-Sharp Arched Eyebrows -->
      <path d="M160,178 Q174,166 188,176" stroke="#1E1612" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,176 Q226,166 240,178" stroke="#1E1612" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Piercing, Competitive Green/Amber Eyes -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="174" cy="196" r="4.2" fill="#588157"/>
        <circle cx="174" cy="196" r="1.8" fill="#000000"/>
        <circle cx="175.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
        <!-- Fierce Winged Liner -->
        <path d="M182,194 L190,188" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

        <ellipse cx="226" cy="196" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="226" cy="196" r="4.2" fill="#588157"/>
        <circle cx="226" cy="196" r="1.8" fill="#000000"/>
        <circle cx="227.5" cy="194.5" r="1.2" fill="#FFFFFF"/>
        <path d="M234,194 L242,188" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Nose -->
      <path d="M198,194 L195,220 Q200,224 205,220 L202,194" fill="#C97E5E" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Predatory, Razor-Sharp Smirk (Dark Berry Lip) -->
      <path d="M180,246 Q200,248 224,240" stroke="#7209B7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M218,238 Q225,242 222,248" stroke="#7209B7" stroke-width="2" fill="none"/>

      <!-- PROP: SLEEK GOLD BALLPOINT PEN HELD LIKE A DAGGER -->
      <g transform="translate(236, 360) rotate(-18)">
        <!-- Heavy Metallic Gold Pen Body -->
        <rect x="0" y="0" width="8" height="96" rx="2" fill="url(#goldPenGrad)" stroke="#7A5807" stroke-width="1.5"/>
        <polygon points="0,0 8,0 4,-12" fill="#212529" stroke="#7A5807" stroke-width="1.2"/> <!-- Nib tip -->
        <!-- Gold Pocket Clip -->
        <line x1="-3" y1="20" x2="-3" y2="54" stroke="#7A5807" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Nadia's Manicured Hand Gripping Pen like a Weapon -->
        <g transform="translate(-10, 40)">
          <path d="M0,0 C-8,10 -6,22 4,28 L14,24 C8,18 8,8 14,0 Z" fill="#FCE1D4" stroke="#4A3228" stroke-width="1.8"/>
          <!-- Glossy black manicured nails -->
          <circle cx="6" cy="4" r="2.5" fill="#1C1F22"/>
          <circle cx="4" cy="12" r="2.5" fill="#1C1F22"/>
          <circle cx="4" cy="20" r="2.5" fill="#1C1F22"/>
        </g>
      </g>

    </g>
  </g>
</svg>