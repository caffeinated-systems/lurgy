<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- IT Slate-Cyan Partition -->
    <linearGradient id="taniaPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#587B87"/>
      <stop offset="100%" stop-color="#3E5A64"/>
    </linearGradient>

    <!-- Tech Softshell Jacket Gradient -->
    <linearGradient id="softshellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2D2F"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>

    <linearGradient id="taniaSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE5D8"/>
      <stop offset="100%" stop-color="#E2B29B"/>
    </linearGradient>

    <filter id="softShadowTania" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="neonBlueGlowT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>

    <clipPath id="taniaClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- IT Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#taniaPartition)"/>

    <!-- Phishing Audit Results Note -->
    <g transform="translate(48, 110) rotate(3)">
      <rect width="60" height="48" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
      <rect width="60" height="8" fill="#D90429"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">SECURITY AUDIT</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">"FREE PIZZA" EMAIL</text>
      <text x="30" y="30" font-family="Arial Black, Impact" font-size="6" fill="#D90429" text-anchor="middle">100% CLICKED</text>
      <text x="30" y="41" font-family="Arial" font-size="5" font-weight="bold" fill="#6C757D" text-anchor="middle">SHAMEFUL.</text>
      <circle cx="30" cy="3" r="1.8" fill="#00E5FF"/>
    </g>

    <!-- CHARACTER: TANIA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowTania)">

      <!-- Black Minimalist Turtleneck -->
      <path d="M164,250 L164,306 C164,322 236,322 236,306 L236,250 Z" fill="#161718" stroke="#000000" stroke-width="2.5"/>

      <!-- Technical Charcoal Softshell Jacket -->
      <path d="M50,560 L52,490 L60,374 C66,328 106,306 156,300 L244,300 C294,306 334,328 340,374 L348,490 L350,560 Z"
            fill="url(#softshellGrad)" stroke="#0E0F10" stroke-width="3"/>

      <!-- Technical Zip & Seams -->
      <line x1="200" y1="316" x2="200" y2="560" stroke="#00E5FF" stroke-width="3"/> <!-- Cyan sealed zipper -->

      <!-- NEON BLUE IT LANYARD (Loaded with Security Tokens) -->
      <g filter="url(#neonBlueGlowT)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Hardware Security Key (YubiKey) hanging from Lanyard -->
      <rect x="194" y="440" width="12" height="24" rx="2" fill="#212529" stroke="#00E5FF" stroke-width="1.5"/>
      <circle cx="200" cy="452" r="3" fill="#E9C46A"/> <!-- Gold sensor contact -->

      <!-- Head Base (Sharp Angular Features) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,220 C252,258 226,278 200,278 C174,278 148,258 148,220 Z"
            fill="url(#taniaSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Ears -->
      <ellipse cx="142" cy="206" rx="8" ry="16" fill="#E2B29B" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="258" cy="206" rx="8" ry="16" fill="#E2B29B" stroke="#4A3228" stroke-width="2"/>

      <!-- SLEEK DARK BOB WITH SEVERE BLUNT BANGS -->
      <path d="M138,172 C132,118 152,86 200,86 C248,86 268,118 262,172 C262,204 256,236 248,244 C244,180 236,140 200,140 C164,140 156,180 152,244 C144,236 138,204 138,172 Z"
            fill="#161718" stroke="#000000" stroke-width="2.5"/>
      <!-- Severe Razor-Cut Blunt Bangs -->
      <rect x="148" y="146" width="104" height="24" fill="#161718" stroke="#000000" stroke-width="1"/>
      <line x1="148" y1="170" x2="252" y2="170" stroke="#000000" stroke-width="2"/>

      <!-- Piercing, Cold Scrutinizing Eyes -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="5.5" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <circle cx="174" cy="196" r="3.8" fill="#3D5A80"/>
        <circle cx="174" cy="196" r="1.6" fill="#000000"/>
        <circle cx="175" cy="195" r="1.2" fill="#FFFFFF"/>

        <ellipse cx="226" cy="196" rx="8" ry="5.5" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <circle cx="226" cy="196" r="3.8" fill="#3D5A80"/>
        <circle cx="226" cy="196" r="1.6" fill="#000000"/>
        <circle cx="227" cy="195" r="1.2" fill="#FFFFFF"/>
      </g>

      <!-- Thin Sharp Nose -->
      <path d="M198,194 L195,220 Q200,224 205,220 L202,194" fill="#C99178" stroke="#7A4E39" stroke-width="1.8"/>

      <!-- Victorious, Icy Smirk (Caught You in the Phishing Trap) -->
      <path d="M182,244 Q200,242 222,236" stroke="#4A1E17" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M216,234 Q222,238 220,242" stroke="#4A1E17" stroke-width="2" fill="none"/>

      <!-- PROP: STICKY NOTE PAD ("PASSWORD123! IS NOT SECURE") -->
      <g transform="translate(224, 370) rotate(-10)">
        <!-- Yellow Post-It Pad -->
        <rect x="0" y="0" width="76" height="76" rx="2" fill="#FFEE32" stroke="#DDA15E" stroke-width="1.5"/>
        <line x1="0" y1="6" x2="76" y2="6" stroke="#FFD166" stroke-width="3"/> <!-- Top adhesive strip -->
        <!-- Scribed Red Warning -->
        <text x="38" y="24" font-family="'Courier New', monospace" font-size="6.5" font-weight="900" fill="#D90429" text-anchor="middle">PASSWORD123!</text>
        <text x="38" y="34" font-family="Arial Black, Impact" font-size="6" fill="#000000" text-anchor="middle">IS NOT SECURE</text>
        <line x1="8" y1="46" x2="68" y2="46" stroke="#D90429" stroke-width="2"/>
        <text x="38" y="58" font-family="monospace" font-size="5" font-weight="bold" fill="#000000" text-anchor="middle">I SEE YOUR LOGS</text>

        <!-- Tania's Hand Gripping the Pad -->
        <g transform="translate(6, 46)">
          <path d="M-10,0 C-14,10 -4,22 8,18 L8,0 Z" fill="#FCE5D8" stroke="#4A3228" stroke-width="1.8"/>
        </g>
      </g>

    </g>
  </g>
</svg>