<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Finance Drab Olive Partition -->
    <linearGradient id="sophiaPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A664B"/>
      <stop offset="100%" stop-color="#3C4532"/>
    </linearGradient>

    <!-- Sunshine Yellow Sweater Gradient -->
    <linearGradient id="sunSweater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E9B23B"/>
    </linearGradient>

    <linearGradient id="sophiaSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE8DF"/>
      <stop offset="100%" stop-color="#EDBFA8"/>
    </linearGradient>

    <filter id="softShadowSophia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="mustardLanyardGlowSop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F4A261" flood-opacity="0.6"/>
    </filter>

    <clipPath id="sophiaClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Finance Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#sophiaPartition)"/>

    <!-- 5-Star Audit Post-it -->
    <g transform="translate(48, 110) rotate(-3)">
      <rect width="60" height="48" rx="2" fill="#FFFFFF" stroke="#3C4532" stroke-width="1"/>
      <rect width="60" height="8" fill="#F4A261"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">ACCOUNTS RATING</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">EXPENSE SCORE:</text>
      <text x="30" y="32" font-family="Arial Black, Impact" font-size="7" fill="#F4A261" text-anchor="middle">★★★★★</text>
      <text x="30" y="42" font-family="Arial" font-size="5" font-weight="bold" fill="#2B9348" text-anchor="middle">APPROVED!</text>
      <circle cx="30" cy="3" r="1.8" fill="#F4A261"/>
    </g>

    <!-- CHARACTER: SOPHIA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowSophia)">

      <!-- White Peter Pan Collar -->
      <path d="M166,298 C176,324 198,324 200,306 C202,324 224,324 234,298 Z" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1.8"/>

      <!-- Sunshine Yellow Knit Sweater -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#sunSweater)" stroke="#A67C1E" stroke-width="3"/>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>

      <!-- MUSTARD GOLD FINANCE LANYARD -->
      <g filter="url(#mustardLanyardGlowSop)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#F4A261" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#F4A261" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#FFE3C2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#FFE3C2" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base (Youthful, Radiantly Cheerful) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,282 200,282 C174,282 148,260 148,222 Z"
            fill="url(#sophiaSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Cheerful Apple Cheeks -->
      <circle cx="164" cy="224" r="14" fill="#FF758F" opacity="0.4"/>
      <circle cx="236" cy="224" r="14" fill="#FF758F" opacity="0.4"/>

      <!-- Ears -->
      <ellipse cx="142" cy="206" rx="8" ry="16" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="258" cy="206" rx="8" ry="16" fill="#EDBFA8" stroke="#4A3228" stroke-width="2"/>

      <!-- BOUNCY BRUNETTE HIGH PONYTAIL -->
      <path d="M142,172 C136,120 156,86 200,86 C244,86 264,120 258,172 C250,146 236,136 200,136 C164,136 150,146 142,172 Z"
            fill="#4A3022" stroke="#26170E" stroke-width="2"/>
      <!-- High Ponytail Bobble & Cascade -->
      <circle cx="200" cy="74" r="8" fill="#FFD166"/>
      <path d="M204,74 C244,68 276,104 274,180 C272,210 262,220 258,190 C254,130 230,84 200,78 Z"
            fill="#4A3022" stroke="#26170E" stroke-width="2"/>

      <!-- High, Energetic Eyebrows -->
      <path d="M160,174 Q174,164 188,174" stroke="#4A3022" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,174 Q226,164 240,174" stroke="#4A3022" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Wide, Dazzling Sparkling Eyes -->
      <g>
        <ellipse cx="174" cy="196" rx="8" ry="7" fill="#FFFFFF"/>
        <circle cx="174" cy="196" r="4.2" fill="#5C3A21"/>
        <circle cx="174" cy="196" r="1.8" fill="#000000"/>
        <circle cx="176" cy="194" r="1.5" fill="#FFFFFF"/>

        <ellipse cx="226" cy="196" rx="8" ry="7" fill="#FFFFFF"/>
        <circle cx="226" cy="196" r="4.2" fill="#5C3A21"/>
        <circle cx="226" cy="196" r="1.8" fill="#000000"/>
        <circle cx="228" cy="194" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Nose -->
      <path d="M197,196 L195,222 Q200,226 205,222 L203,196" fill="#DDAF97" stroke="#8C5237" stroke-width="1.8"/>

      <!-- Radiant Toothpaste-Commercial Smile (Blinding Joy) -->
      <path d="M174,240 Q200,268 226,240 Z" fill="#D90429" stroke="#7A0012" stroke-width="2"/>
      <path d="M178,241 Q200,250 222,241" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round"/> <!-- Big white smile -->

      <!-- PROP: 5-STAR CLIPBOARD (Held up proudly) -->
      <g transform="translate(224, 350) rotate(-8)">
        <!-- Hardboard Clipboard Base -->
        <rect x="0" y="0" width="84" height="114" rx="4" fill="#D4A373" stroke="#8C5828" stroke-width="2"/>
        <!-- Steel Clip at Top -->
        <rect x="22" y="-6" width="40" height="14" rx="2" fill="#CFD8DC" stroke="#455A64" stroke-width="1.5"/>
        <!-- Attached White Audit Sheet -->
        <rect x="6" y="12" width="72" height="96" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>

        <!-- Header Text -->
        <text x="42" y="26" font-family="Arial, sans-serif" font-size="5" font-weight="900" fill="#212529" text-anchor="middle">RATE EXPERIENCE:</text>

        <!-- Five Bright Gold Stars -->
        <text x="42" y="44" font-family="Arial Black, Impact" font-size="11" fill="#FFB703" text-anchor="middle">★★★★★</text>

        <!-- Big Red "APPROVED!" Stamp -->
        <g transform="translate(14, 54) rotate(-10)">
          <rect x="0" y="0" width="56" height="20" rx="2" fill="none" stroke="#2B9348" stroke-width="2" stroke-dasharray="4,2"/>
          <text x="28" y="14" font-family="Arial Black, Impact" font-size="7" fill="#2B9348" text-anchor="middle">BALANCED!</text>
        </g>

        <!-- Sophia's Hand Supporting Clipboard -->
        <g transform="translate(10, 70)">
          <path d="M-10,0 C-14,10 -4,22 8,18 L8,0 Z" fill="#FDE8DF" stroke="#4A3228" stroke-width="1.8"/>
        </g>
      </g>

    </g>
  </g>
</svg>