<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- IT Slate-Cyan Partition -->
    <linearGradient id="erinPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#587B87"/>
      <stop offset="100%" stop-color="#3E5A64"/>
    </linearGradient>

    <!-- Faded Charcoal Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3D40"/>
      <stop offset="100%" stop-color="#212326"/>
    </linearGradient>

    <linearGradient id="erinSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE5D8"/>
      <stop offset="100%" stop-color="#E8BFA8"/>
    </linearGradient>

    <filter id="softShadowErin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="neonBlueGlowE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>

    <clipPath id="erinClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- IT Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#erinPartition)"/>

    <!-- Printer Ticket Note -->
    <g transform="translate(48, 110) rotate(-3)">
      <rect width="60" height="48" rx="2" fill="#FFFFFF" stroke="#3E5A64" stroke-width="1"/>
      <rect width="60" height="8" fill="#E63946"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">INCIDENT #4092</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">PRINTER FEUD:</text>
      <text x="30" y="30" font-family="Arial Black, Impact" font-size="6" fill="#2B2D42" text-anchor="middle">RESOLVED (MENACE)</text>
      <text x="30" y="41" font-family="monospace" font-size="5" font-weight="bold" fill="#00A896" text-anchor="middle">TICKET CLOSED.</text>
      <circle cx="30" cy="3" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- CHARACTER: ERIN (Shifted up, slouching deadpan posture) -->
    <g transform="translate(0, -54)" filter="url(#softShadowErin)">

      <!-- Oversized Charcoal Band Hoodie -->
      <path d="M48,560 L50,490 L60,374 C66,328 106,306 156,300 L244,300 C294,306 334,328 340,374 L350,490 L352,560 Z"
            fill="url(#hoodieGrad)" stroke="#161718" stroke-width="3"/>

      <!-- Loose Slouchy Hoodie Hood draped on shoulders -->
      <path d="M140,314 C120,340 120,380 144,400 C168,420 232,420 256,400 C280,380 280,340 260,314 Z"
            fill="#2B2D2F" stroke="#161718" stroke-width="2"/>

      <!-- Faint Faded Band Logo on Hoodie -->
      <path d="M185,350 L200,328 L215,350 L208,350 L200,338 L192,350 Z" fill="#6C757D" opacity="0.4"/>

      <!-- Slapped Label Sticker ("HAVE YOU TRIED REBOOTING?") -->
      <g transform="translate(130, 360) rotate(-2)">
        <rect width="140" height="34" rx="3" fill="#FFF3B0" stroke="#E0A922" stroke-width="1.8"/>
        <text x="70" y="16" font-family="Arial Black, Impact" font-size="7.5" fill="#1C1F1A" text-anchor="middle">HAVE YOU TRIED</text>
        <text x="70" y="27" font-family="Arial Black, Impact" font-size="8" fill="#D90429" text-anchor="middle">REBOOTING?</text>
      </g>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#E8BFA8" stroke="#4A3228" stroke-width="2"/>

      <!-- NEON BLUE IT LANYARD -->
      <g filter="url(#neonBlueGlowE)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#00E5FF" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#B8F9FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,280 200,280 C174,280 148,260 148,222 Z"
            fill="url(#erinSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Sleep-Deprived Dark Under-Eye Bags -->
      <ellipse cx="174" cy="204" rx="14" ry="7" fill="#7D657D" opacity="0.4"/>
      <ellipse cx="226" cy="204" rx="14" ry="7" fill="#7D657D" opacity="0.4"/>

      <!-- MASSIVE MATTE-BLACK NOISE-CANCELLING HEADPHONES -->
      <!-- Padded Headband Arch -->
      <path d="M130,170 C120,90 140,66 200,66 C260,66 280,90 270,170" fill="none" stroke="#161718" stroke-width="12" stroke-linecap="round"/>
      <path d="M130,170 C120,90 140,66 200,66 C260,66 280,90 270,170" fill="none" stroke="#3A3D40" stroke-width="6" stroke-linecap="round"/>
      <!-- Left Ear Cup (Huge, cushioned) -->
      <rect x="122" y="174" width="22" height="48" rx="8" fill="#1C1E20" stroke="#000000" stroke-width="2.5"/>
      <rect x="136" y="180" width="8" height="36" rx="3" fill="#3A3D40"/>
      <!-- Right Ear Cup -->
      <rect x="256" y="174" width="22" height="48" rx="8" fill="#1C1E20" stroke="#000000" stroke-width="2.5"/>
      <rect x="256" y="180" width="8" height="36" rx="3" fill="#3A3D40"/>

      <!-- MESSY DARK HAIR WITH CHOPSTICK BUN -->
      <!-- Hair Volume -->
      <path d="M142,168 C138,124 154,92 200,92 C246,92 262,124 258,168 C250,146 236,138 200,138 C164,138 150,146 142,168 Z"
            fill="#212326" stroke="#0E0F10" stroke-width="2"/>
      <!-- Top Messy Bun -->
      <circle cx="200" cy="80" r="22" fill="#212326" stroke="#0E0F10" stroke-width="2"/>
      <!-- Chopstick shoved through bun -->
      <line x1="164" y1="94" x2="236" y2="66" stroke="#DDA15E" stroke-width="4" stroke-linecap="round"/>

      <!-- Flat, Unimpressed Eyebrows -->
      <line x1="162" y1="184" x2="186" y2="184" stroke="#161718" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="214" y1="184" x2="238" y2="184" stroke="#161718" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Deadpan, Unblinking Stare (Pure Void) -->
      <g>
        <ellipse cx="174" cy="198" rx="7.5" ry="5.5" fill="#FFFFFF" stroke="#161718" stroke-width="1.8"/>
        <circle cx="174" cy="198" r="3.5" fill="#2B2D2F"/>
        <circle cx="174" cy="198" r="1.5" fill="#000000"/>

        <ellipse cx="226" cy="198" rx="7.5" ry="5.5" fill="#FFFFFF" stroke="#161718" stroke-width="1.8"/>
        <circle cx="226" cy="198" r="3.5" fill="#2B2D2F"/>
        <circle cx="226" cy="198" r="1.5" fill="#000000"/>
      </g>

      <!-- Nose -->
      <path d="M197,196 L195,220 Q200,224 205,220 L203,196" fill="#DDAF97" stroke="#8C5237" stroke-width="1.8"/>

      <!-- Completely Flat Deadpan Mouth (Zero emotion) -->
      <line x1="186" y1="248" x2="214" y2="248" stroke="#5E3023" stroke-width="3" stroke-linecap="round"/>

    </g>
  </g>
</svg>