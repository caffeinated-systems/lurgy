<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Sales Burgundy Partition -->
    <linearGradient id="rosaPartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#723344"/>
      <stop offset="100%" stop-color="#441C27"/>
    </linearGradient>

    <!-- Mustard Knit Wrap Gradient -->
    <linearGradient id="mustardWrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#B88A24"/>
    </linearGradient>

    <linearGradient id="rosaSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE5D8"/>
      <stop offset="100%" stop-color="#EABCA4"/>
    </linearGradient>

    <filter id="softShadowRosa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="crimsonLanyardGlowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E63946" flood-opacity="0.6"/>
    </filter>

    <clipPath id="rosaClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Sales Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#rosaPartition)"/>

    <!-- Gossip Schedule Note -->
    <g transform="translate(48, 110) rotate(-4)">
      <rect width="60" height="48" rx="2" fill="#FFF0F3" stroke="#E63946" stroke-width="1"/>
      <rect width="60" height="8" fill="#E63946"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">TEA RUN INTEL</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">10:15 - HR WHISPERS</text>
      <text x="30" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#1C1F1A" text-anchor="middle">11:30 - FINANCE LEAKS</text>
      <text x="30" y="41" font-family="Arial Black, Impact" font-size="6" fill="#A4133C" text-anchor="middle">MUM'S THE WORD</text>
      <circle cx="30" cy="3" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- CHROME TEA TROLLEY HANDLE (Peeking in from bottom right) -->
    <g transform="translate(310, 420)">
      <path d="M0,0 Q30,-20 60,10 L70,90" fill="none" stroke="#CED4DA" stroke-width="8" stroke-linecap="round"/>
      <path d="M0,0 Q30,-20 60,10 L70,90" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- CHARACTER: ROSA (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowRosa)">

      <!-- Paisley Blouse V -->
      <path d="M160,300 L240,300 L240,380 L160,380 Z" fill="#F4A261"/>
      <circle cx="180" cy="330" r="4" fill="#E76F51"/>
      <circle cx="220" cy="330" r="4" fill="#2A9D8F"/>

      <!-- Cosy Mustard Knitted Wrap -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#mustardWrap)" stroke="#7A5807" stroke-width="3"/>

      <!-- Wrap Folds & Silver Teapot Brooch -->
      <path d="M120,340 Q170,410 220,380" stroke="#9A7005" stroke-width="2.5" fill="none"/>
      <!-- Teapot Brooch on Lapel -->
      <g transform="translate(132, 350) scale(0.9)">
        <ellipse cx="14" cy="14" rx="10" ry="8" fill="#E9ECEF" stroke="#495057" stroke-width="1.5"/>
        <path d="M22,14 Q30,10 24,20" fill="none" stroke="#495057" stroke-width="2"/> <!-- Handle -->
        <path d="M6,14 Q-2,10 0,6" fill="none" stroke="#495057" stroke-width="2"/> <!-- Spout -->
        <circle cx="14" cy="5" r="2" fill="#E9ECEF" stroke="#495057" stroke-width="1"/>
      </g>

      <!-- Neck -->
      <path d="M170,258 L170,306 C170,322 230,322 230,306 L230,258 Z" fill="#EABCA4" stroke="#4A3228" stroke-width="2"/>

      <!-- CLARET CRIMSON SALES LANYARD -->
      <g filter="url(#crimsonLanyardGlowR)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Head Base (Soft, Warm, Mid 40s) -->
      <path d="M144,174 C144,136 256,136 256,174 L256,226 C256,264 228,284 200,284 C172,284 144,264 144,226 Z"
            fill="url(#rosaSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Warm Apple Cheeks -->
      <circle cx="164" cy="226" r="14" fill="#FF758F" opacity="0.45"/>
      <circle cx="236" cy="226" r="14" fill="#FF758F" opacity="0.45"/>

      <!-- Ears -->
      <ellipse cx="140" cy="210" rx="9" ry="16" fill="#EABCA4" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="260" cy="210" rx="9" ry="16" fill="#EABCA4" stroke="#4A3228" stroke-width="2"/>

      <!-- CURLY BRUNETTE HAIR WITH TORTOISESHELL SIDE CLIP -->
      <path d="M136,176 C128,122 148,86 200,86 C252,86 272,122 264,176 C274,204 274,242 260,256 C252,228 250,180 250,180 C234,152 220,144 200,144 C176,144 162,152 148,180 C148,180 146,228 138,256 C124,242 124,204 136,176 Z"
            fill="#4A3022" stroke="#26170E" stroke-width="2.5"/>
      <!-- Curly Bunches & Volume -->
      <circle cx="138" cy="160" r="14" fill="#5C3D2E"/>
      <circle cx="262" cy="160" r="14" fill="#5C3D2E"/>
      <!-- Tortoiseshell Hair Clip on right temple -->
      <rect x="238" y="146" width="18" height="6" rx="2" fill="#D4A373" stroke="#8C5828" stroke-width="1.2" transform="rotate(-15, 247, 149)"/>

      <!-- Eyebrows (Arched, Inquisitive) -->
      <path d="M162,178 Q174,168 188,178" stroke="#382115" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,176 Q226,166 238,178" stroke="#382115" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Mischievous Twinkling Eyes (Sideways intelligence glance) -->
      <g>
        <ellipse cx="174" cy="198" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="177" cy="198" r="4.2" fill="#5C3D2E"/>
        <circle cx="177" cy="198" r="1.8" fill="#000000"/>
        <circle cx="178.5" cy="196.5" r="1.2" fill="#FFFFFF"/>

        <ellipse cx="226" cy="198" rx="8" ry="6.5" fill="#FFFFFF"/>
        <circle cx="229" cy="198" r="4.2" fill="#5C3D2E"/>
        <circle cx="229" cy="198" r="1.8" fill="#000000"/>
        <circle cx="230.5" cy="196.5" r="1.2" fill="#FFFFFF"/>
      </g>

      <!-- Soft Button Nose -->
      <path d="M197,196 L195,222 Q200,226 205,222 L203,196" fill="#DB9F87" stroke="#8D5237" stroke-width="1.8"/>

      <!-- Conspiratorial Hushed Smirk -->
      <path d="M182,246 Q200,256 220,244" stroke="#8C2F39" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M216,242 Q222,246 220,250" stroke="#8C2F39" stroke-width="2" fill="none"/>

      <!-- PROP: FINGER TO LIPS ("I'M NOT A GOSSIP, BUT COME CLOSER") -->
      <g transform="translate(192, 236)">
        <path d="M6,0 L6,34 L18,34 L18,12 Z" fill="#FCE5D8" stroke="#4A3228" stroke-width="2"/>
        <!-- Fingernail -->
        <ellipse cx="12" cy="4" rx="3.5" ry="4" fill="#FFCCD5"/>
      </g>

    </g>
  </g>
</svg>