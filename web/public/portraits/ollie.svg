<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Sales Burgundy Partition -->
    <linearGradient id="olliePartition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#723344"/>
      <stop offset="100%" stop-color="#441C27"/>
    </linearGradient>

    <!-- Sky Blue Oxford Shirt Gradient -->
    <linearGradient id="oxfordShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E3F0"/>
      <stop offset="100%" stop-color="#A9C7DE"/>
    </linearGradient>

    <linearGradient id="ollieSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE8DF"/>
      <stop offset="100%" stop-color="#F0C2B0"/>
    </linearGradient>

    <filter id="softShadowOllie" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#192024" flood-opacity="0.32"/>
    </filter>

    <filter id="crimsonLanyardGlowO" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E63946" flood-opacity="0.6"/>
    </filter>

    <clipPath id="ollieClip">
      <rect x="6" y="6" width="388" height="488" rx="12"/>
    </clipPath>
  </defs>

  <g>
    <!-- BACKDROP -->
    <rect width="400" height="500" fill="#D8D3C6"/>
    <polygon points="0,0 400,0 400,46 0,46" fill="#E5E0D5"/>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#B7B0A2" stroke-width="2.5"/>
    <line x1="85" y1="0" x2="70" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>
    <line x1="305" y1="0" x2="320" y2="46" stroke="#C7C1B4" stroke-width="1.5"/>

    <!-- Sales Screen -->
    <rect x="24" y="82" width="352" height="418" rx="14" fill="#9BA2A6"/>
    <rect x="30" y="88" width="340" height="412" rx="10" fill="url(#olliePartition)"/>

    <!-- LinkedIn Draft Sticky Note -->
    <g transform="translate(48, 110) rotate(-5)">
      <rect width="60" height="50" rx="2" fill="#EBF4F6" stroke="#0077B5" stroke-width="1.2"/>
      <rect width="60" height="8" fill="#0077B5"/>
      <text x="30" y="6.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle">LINKEDIN DRAFT</text>
      <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">WHAT RECEPTION</text>
      <text x="30" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="5" fill="#1C1F1A" text-anchor="middle">TAUGHT ME ABOUT</text>
      <text x="30" y="38" font-family="Arial Black, Impact" font-size="6" fill="#0077B5" text-anchor="middle">B2B RESILIENCE</text>
      <circle cx="30" cy="3" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- CHARACTER: OLLIE (Shifted up) -->
    <g transform="translate(0, -54)" filter="url(#softShadowOllie)">

      <!-- Slightly Crumpled Sky-Blue Oxford Shirt -->
      <path d="M50,560 L52,490 L62,374 C68,332 110,308 156,302 L244,302 C290,308 332,332 338,374 L348,490 L350,560 Z"
            fill="url(#oxfordShirt)" stroke="#3A5A73" stroke-width="3"/>

      <!-- Button-Down Collar (Buttoned slightly too high/tight) -->
      <polygon points="166,294 196,334 174,338 152,306" fill="#D0E3F0" stroke="#3A5A73" stroke-width="1.8"/>
      <polygon points="234,294 204,334 226,338 248,306" fill="#D0E3F0" stroke="#3A5A73" stroke-width="1.8"/>
      <circle cx="200" cy="328" r="2.5" fill="#FFFFFF" stroke="#3A5A73" stroke-width="1"/>
      <!-- Button Placket -->
      <line x1="200" y1="334" x2="200" y2="560" stroke="#3A5A73" stroke-width="2"/>
      <circle cx="200" cy="365" r="2.5" fill="#FFFFFF" stroke="#3A5A73" stroke-width="1"/>
      <circle cx="200" cy="405" r="2.5" fill="#FFFFFF" stroke="#3A5A73" stroke-width="1"/>

      <!-- Neck -->
      <path d="M172,258 L172,306 C172,322 228,322 228,306 L228,258 Z" fill="#F0C2B0" stroke="#4A3228" stroke-width="2"/>

      <!-- CLARET CRIMSON SALES LANYARD -->
      <g filter="url(#crimsonLanyardGlowO)">
        <path d="M158,298 C162,356 182,408 196,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M242,298 C238,356 218,408 204,442" stroke="#E63946" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M158,298 C162,356 182,408 196,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M242,298 C238,356 218,408 204,442" stroke="#FFCCD5" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- FRAYED LAMINATED VISITOR PASS (The Intern Who Never Left) -->
      <g transform="translate(180, 442) rotate(4)">
        <rect width="40" height="52" rx="4" fill="#FFFFFF" stroke="#6C757D" stroke-width="1.8"/>
        <!-- Red "VISITOR / TEMP" Banner -->
        <rect width="40" height="12" rx="2" fill="#E63946"/>
        <text x="20" y="9" font-family="Arial Black, Impact" font-size="6" fill="#FFFFFF" text-anchor="middle">TEMP PASS</text>
        <!-- Peeling corner hint -->
        <polygon points="34,46 40,40 34,40" fill="#CED4DA"/>
        <!-- Faint Photo & Name -->
        <rect x="6" y="18" width="12" height="14" fill="#E9ECEF"/>
        <text x="28" y="26" font-family="Arial" font-size="5" font-weight="bold" fill="#212529">OLLIE</text>
        <text x="28" y="32" font-family="Arial" font-size="4" fill="#6C757D">INTERN</text>
      </g>

      <!-- Head Base (Youthful, Slightly Oval) -->
      <path d="M148,168 C148,132 252,132 252,168 L252,222 C252,260 226,282 200,282 C174,282 148,260 148,222 Z"
            fill="url(#ollieSkin)" stroke="#4A3228" stroke-width="2.5"/>

      <!-- Ears (Slightly prominent / eager) -->
      <ellipse cx="140" cy="206" rx="9" ry="17" fill="#F0C2B0" stroke="#4A3228" stroke-width="2"/>
      <ellipse cx="260" cy="206" rx="9" ry="17" fill="#F0C2B0" stroke="#4A3228" stroke-width="2"/>

      <!-- UNRULY FLOPPY STUDENT HAIR (Chestnut Brown) -->
      <path d="M138,172 C132,120 152,86 200,86 C248,86 268,120 262,172 C252,142 236,132 200,132 C164,132 148,142 138,172 Z"
            fill="#5C3A21" stroke="#2B180B" stroke-width="2"/>
      <!-- Floppy fringe sweeping across forehead -->
      <path d="M142,144 Q170,166 210,148 Q234,138 256,152 Q234,124 200,126 Q162,126 142,144 Z"
            fill="#754C2E" stroke="#2B180B" stroke-width="1.8"/>

      <!-- High, Anxious-Eager Arched Eyebrows -->
      <path d="M160,174 Q174,164 188,174" stroke="#452714" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M212,174 Q226,164 240,174" stroke="#452714" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- Wide, Eager Puppy-Dog Eyes ("Please endorse my skill on LinkedIn") -->
      <g>
        <ellipse cx="174" cy="196" rx="9" ry="8" fill="#FFFFFF" stroke="#212529" stroke-width="2"/>
        <circle cx="174" cy="196" r="4.8" fill="#3D2314"/>
        <circle cx="174" cy="196" r="2" fill="#000000"/>
        <circle cx="176" cy="194" r="1.8" fill="#FFFFFF"/>

        <ellipse cx="226" cy="196" rx="9" ry="8" fill="#FFFFFF" stroke="#212529" stroke-width="2"/>
        <circle cx="226" cy="196" r="4.8" fill="#3D2314"/>
        <circle cx="226" cy="196" r="2" fill="#000000"/>
        <circle cx="228" cy="194" r="1.8" fill="#FFFFFF"/>
      </g>

      <!-- Youthful Nose with Slight Flush -->
      <path d="M197,196 L195,222 Q200,226 205,222 L203,196" fill="#E8A992" stroke="#8C5237" stroke-width="1.8"/>

      <!-- Desperate, Hopeful Smile -->
      <path d="M178,244 Q200,266 222,244 Z" fill="#FFFFFF" stroke="#3A1D13" stroke-width="2"/>
      <path d="M182,246 Q200,252 218,246" stroke="#4A1E17" stroke-width="1.5" fill="none"/>

      <!-- PROP: CHIPPED OFFICE MUG (Holding with both eager hands) -->
      <g transform="translate(136, 396)">
        <!-- Mug Body -->
        <rect x="0" y="0" width="60" height="68" rx="4" fill="#FFFFFF" stroke="#495057" stroke-width="2"/>
        <!-- Handle -->
        <path d="M60,12 C74,12 74,48 60,48" fill="none" stroke="#495057" stroke-width="4"/>
        <!-- Tiny chip on rim -->
        <polygon points="12,0 16,3 20,0" fill="#D0E3F0"/>
        <!-- Tea Bag String hanging over edge -->
        <path d="M30,0 Q34,16 42,24" fill="none" stroke="#D5BDAF" stroke-width="1.5"/>
        <rect x="40" y="24" width="8" height="10" rx="1" fill="#FFB703"/>

        <!-- Ollie's Eager Hands Holding Sides of Mug -->
        <path d="M-8,14 C-12,24 -4,34 6,30 L6,14 Z" fill="#FDE8DF" stroke="#4A3228" stroke-width="1.8"/>
      </g>

    </g>
  </g>
</svg>