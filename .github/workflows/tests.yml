name: Tests
on:
  pull_request:
  push:
    branches: [main]
  # Redeploys main, e.g. after a Week is pushed by hand to the puzzles repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
      - run: uv sync --locked
      - name: Check format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
      - run: npm ci
      - name: Lint and format
        run: npm run check
      - name: Type check
        run: npx tsc -b
      - name: Tests
        run: npm test
      - name: API types match the OpenAPI schema
        run: npm run gen:api && git diff --exit-code && test -z "$(git status --porcelain src/api)"

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
      - run: npm ci
      - name: Install API dependencies
        run: uv sync --locked
        working-directory: api
      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  deploy:
    needs: [api, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Limited to main; holds the Laravel Cloud deploy hook, whose URL is the credential.
    environment: production
    steps:
      - name: Deploy to Laravel Cloud
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        # -o /dev/null: Cloud's reply would land in this public repo's log.
        run: curl --fail --silent --show-error --max-time 60 -o /dev/null -X POST "$HOOK?commit_hash=$GITHUB_SHA"
