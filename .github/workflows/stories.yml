name: Stories
on:
  pull_request:
  push:
    branches: [main]
  # Warnings on a push go unseen if nobody pushes, so check every Monday and fail
  # if the next two Weeks have no story: a failed scheduled run emails the owner.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
      - run: uv sync --locked
      - name: Cast and stories
        run: uv run python -m app.cast check ${{ github.event_name == 'schedule' && '--strict' || '' }}
